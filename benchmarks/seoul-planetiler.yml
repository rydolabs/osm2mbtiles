# HISTORICAL COMPARISON PROFILE -- NOT a semantic-equivalent profile.
# The broad natural filters place non-water terrain into the water layer.
# See docs/BENCHMARKS.md; never treat layer counts here as map-quality scores.
# Approximate shared coverage/attributes for comparative SEOUL performance runs.
# NOT exact semantic equivalence to osm2mbtiles SQL. Review decoded feature counts.
schema_name: Seoul OSM Detailed Benchmark
schema_description: Planetiler custom profile approximating osm2mbtiles vector layers
attribution: © OpenStreetMap contributors
sources:
  osm:
    type: osm
    local_path: seoul.osm.pbf
layers:
  - id: road
    features:
      - source: osm
        geometry: line
        min_zoom: 6
        include_when:
          'highway': __any__
        exclude_when:
          'highway': [footway, cycleway, path, steps, pedestrian, bridleway]
        attributes:
          - key: class
            tag_value: 'highway'
          - key: 'name'
            tag_value: 'name'
          - key: 'name:ko'
            tag_value: 'name:ko'
          - key: 'name:en'
            tag_value: 'name:en'
          - key: 'ref'
            tag_value: 'ref'
          - key: 'maxspeed'
            tag_value: 'maxspeed'
          - key: 'lanes'
            tag_value: 'lanes'
          - key: 'surface'
            tag_value: 'surface'
          - key: 'oneway'
            tag_value: 'oneway'
          - key: 'bridge'
            tag_value: 'bridge'
          - key: 'tunnel'
            tag_value: 'tunnel'
          - key: 'access'
            tag_value: 'access'
  - id: pathway
    features:
      - source: osm
        geometry: line
        min_zoom: 12
        include_when:
          'highway': [footway, cycleway, path, steps, pedestrian, bridleway]
        attributes:
          - key: class
            tag_value: 'highway'
          - key: 'name'
            tag_value: 'name'
          - key: 'surface'
            tag_value: 'surface'
          - key: 'foot'
            tag_value: 'foot'
          - key: 'bicycle'
            tag_value: 'bicycle'
          - key: 'access'
            tag_value: 'access'
          - key: 'width'
            tag_value: 'width'
          - key: 'incline'
            tag_value: 'incline'
  - id: railway
    features:
      - source: osm
        geometry: line
        min_zoom: 8
        include_when:
          'railway': '%'
        attributes:
          - key: class
            tag_value: 'railway'
          - key: 'name'
            tag_value: 'name'
          - key: 'ref'
            tag_value: 'ref'
          - key: 'service'
            tag_value: 'service'
          - key: 'bridge'
            tag_value: 'bridge'
          - key: 'tunnel'
            tag_value: 'tunnel'
          - key: 'electrified'
            tag_value: 'electrified'
  - id: building
    features:
      - source: osm
        geometry: polygon
        min_zoom: 13
        include_when:
          'building': '%'
        attributes:
          - key: class
            tag_value: 'building'
          - key: 'name'
            tag_value: 'name'
          - key: 'height'
            tag_value: 'height'
          - key: 'building:levels'
            tag_value: 'building:levels'
          - key: 'addr:housenumber'
            tag_value: 'addr:housenumber'
          - key: 'addr:street'
            tag_value: 'addr:street'
          - key: 'building'
            tag_value: 'building'
          - key: 'building:material'
            tag_value: 'building:material'
  - id: building_part
    features:
      - source: osm
        geometry: polygon
        min_zoom: 14
        include_when:
          'building:part': '%'
        attributes:
          - key: class
            tag_value: 'building:part'
          - key: 'height'
            tag_value: 'height'
          - key: 'min_height'
            tag_value: 'min_height'
          - key: 'building:levels'
            tag_value: 'building:levels'
          - key: 'building:part'
            tag_value: 'building:part'
  - id: landuse
    features:
      - source: osm
        geometry: polygon
        min_zoom: 9
        include_when:
          'landuse': '%'
        attributes:
          - key: class
            tag_value: 'landuse'
          - key: 'name'
            tag_value: 'name'
          - key: 'landuse'
            tag_value: 'landuse'
          - key: 'operator'
            tag_value: 'operator'
  - id: landcover
    features:
      - source: osm
        geometry: polygon
        min_zoom: 7
        include_when:
          'natural': '%'
        attributes:
          - key: class
            tag_value: 'natural'
          - key: 'name'
            tag_value: 'name'
          - key: 'natural'
            tag_value: 'natural'
          - key: 'landcover'
            tag_value: 'landcover'
      - source: osm
        geometry: polygon
        min_zoom: 7
        include_when:
          'landcover': '%'
        attributes:
          - key: class
            tag_value: 'landcover'
          - key: 'name'
            tag_value: 'name'
          - key: 'natural'
            tag_value: 'natural'
          - key: 'landcover'
            tag_value: 'landcover'
  - id: leisure
    features:
      - source: osm
        geometry: polygon
        min_zoom: 10
        include_when:
          'leisure': '%'
        attributes:
