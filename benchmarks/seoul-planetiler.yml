          - key: 'sport'
            tag_value: 'sport'
  - id: water
    features:
      - source: osm
        geometry: polygon
        min_zoom: 5
        include_when:
          'natural': '%'
        attributes:
          - key: class
            tag_value: 'natural'
          - key: 'name'
            tag_value: 'name'
          - key: 'natural'
            tag_value: 'natural'
          - key: 'water'
            tag_value: 'water'
          - key: 'intermittent'
            tag_value: 'intermittent'
      - source: osm
        geometry: polygon
        min_zoom: 5
        include_when:
          'water': '%'
        attributes:
          - key: class
            tag_value: 'water'
          - key: 'name'
            tag_value: 'name'
          - key: 'natural'
            tag_value: 'natural'
          - key: 'water'
            tag_value: 'water'
          - key: 'intermittent'
            tag_value: 'intermittent'
  - id: waterway
    features:
      - source: osm
        geometry: line
        min_zoom: 8
        include_when:
          'waterway': '%'
        attributes:
          - key: class
            tag_value: 'waterway'
          - key: 'name'
            tag_value: 'name'
          - key: 'waterway'
            tag_value: 'waterway'
          - key: 'intermittent'
            tag_value: 'intermittent'
  - id: boundary
    features:
      - source: osm
        geometry: line
        min_zoom: 3
        include_when:
          'boundary': '%'
        attributes:
          - key: class
            tag_value: 'boundary'
          - key: 'name'
            tag_value: 'name'
          - key: 'name:ko'
            tag_value: 'name:ko'
          - key: 'admin_level'
            tag_value: 'admin_level'
          - key: 'boundary'
            tag_value: 'boundary'
  - id: place
    features:
      - source: osm
        geometry: point
        min_zoom: 5
        include_when:
          'place': '%'
        attributes:
          - key: class
            tag_value: 'place'
          - key: 'name'
            tag_value: 'name'
          - key: 'name:ko'
            tag_value: 'name:ko'
          - key: 'name:en'
            tag_value: 'name:en'
          - key: 'place'
            tag_value: 'place'
          - key: 'population'
            tag_value: 'population'
  - id: poi
    features:
      - source: osm
        geometry: point
        min_zoom:
          default_value: 14
          overrides:
            12:
              amenity: [hospital, university, school, townhall, police, fire_station]
              tourism: [museum, attraction]
        include_when:
          amenity: __any__
          shop: __any__
          tourism: __any__
          office: __any__
          craft: __any__
          historic: __any__
          leisure: __any__
        attributes:
          - key: class
            type: match_value
          - key: 'name'
            tag_value: 'name'
          - key: 'name:ko'
            tag_value: 'name:ko'
          - key: 'name:en'
            tag_value: 'name:en'
          - key: 'brand'
            tag_value: 'brand'
          - key: 'operator'
            tag_value: 'operator'
          - key: 'opening_hours'
            tag_value: 'opening_hours'
          - key: 'amenity'
            tag_value: 'amenity'
          - key: 'shop'
            tag_value: 'shop'
          - key: 'tourism'
            tag_value: 'tourism'
          - key: 'office'
            tag_value: 'office'
          - key: 'craft'
            tag_value: 'craft'
      - source: osm
        geometry: polygon_point_on_surface
        min_zoom:
          default_value: 14
          overrides:
            12:
              amenity: [hospital, university, school, townhall, police, fire_station]
              tourism: [museum, attraction]
        include_when:
          amenity: __any__
          shop: __any__
          tourism: __any__
          office: __any__
          craft: __any__
          historic: __any__
          leisure: __any__
        attributes:
          - key: class
            type: match_value
          - key: 'name'
            tag_value: 'name'
          - key: 'name:ko'
            tag_value: 'name:ko'
          - key: 'name:en'
            tag_value: 'name:en'
          - key: 'brand'
            tag_value: 'brand'
          - key: 'operator'
            tag_value: 'operator'
          - key: 'opening_hours'
            tag_value: 'opening_hours'
          - key: 'amenity'
            tag_value: 'amenity'
          - key: 'shop'
            tag_value: 'shop'
          - key: 'tourism'
            tag_value: 'tourism'
          - key: 'office'
            tag_value: 'office'
          - key: 'craft'
            tag_value: 'craft'
  - id: transport
    features:
      - source: osm
        geometry: point
        min_zoom: 11
        include_when:
          'public_transport': '%'
        attributes:
          - key: class
            tag_value: 'public_transport'
