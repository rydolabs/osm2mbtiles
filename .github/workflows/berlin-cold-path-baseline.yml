name: Berlin 3x fresh-PostGIS full initial PBF to MBTiles baseline

on:
  push:
    branches: [bench/vector-export-io-byte-parity-20261102]
    paths:
      - benchmarks/berlin_cold_path_baseline.py
      - tests/test_berlin_cold_path_baseline.py
      - .github/workflows/berlin-cold-path-baseline.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Parse new benchmark, frozen Berlin match and strict gzip integrity
        run: |
          set -euo pipefail
          python3 -m pip install --break-system-packages pytest mapbox-vector-tile
          python3 -m py_compile benchmarks/berlin_cold_path_baseline.py
          PYTHONPATH="$GITHUB_WORKSPACE/src" python3 -m pytest -q \
            tests/test_berlin_cold_path_baseline.py \
            tests/test_compare_berlin_baseline.py \
            tests/test_benchmark_regions.py

  three-independent-full-builds:
    needs: smoke-tests
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    env:
      WORK: /tmp/osm2mbtiles-cold-berlin
      PGHOST: /tmp/osm2mbtiles-cold-berlin/socket
      PGPORT: '55516'
      PGUSER: coldprobe
      PGDATABASE: gis
      BASE_SHA: 'a29c9b9fd18ee4e85a8e9b08cb21ea51ab004024'
      OSM2MBTILES_VECTOR_QUERY_MODE: projected
    steps:
      - uses: actions/checkout@v4
      - name: Reject any change to frozen production code/SQL
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin "$BASE_SHA"
          git diff --exit-code "$BASE_SHA" HEAD -- src/ vector/
          python3 -m py_compile benchmarks/berlin_cold_path_baseline.py
      - name: Install native PostgreSQL 16 / PostGIS and osm2pgsql
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            postgresql-16 postgresql-client-16 postgresql-16-postgis-3 \
            postgresql-16-postgis-3-scripts osm2pgsql \
            python3-psycopg2 python3-pip curl ca-certificates
          /usr/bin/python3 -m pip install --break-system-packages mapbox-vector-tile
          mkdir -p "$WORK" "$PGHOST"
          chmod 0700 "$WORK" "$PGHOST"
          osm2pgsql --version
          /usr/lib/postgresql/16/bin/pg_ctl --version
          df -h "$WORK"
      - name: Download and verify immutable Berlin PBF once
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 --retry-delay 5 --connect-timeout 30 \
            --max-time 1200 \
            "https://download.geofabrik.de/europe/germany/berlin-261001.osm.pbf" \
            -o "$WORK/source.osm.pbf"
          sha256sum "$WORK/source.osm.pbf" | tee "$WORK/source.sha256"
          echo "51d3845df2e4b1334ebec7cf6516e41e71735ce2fc1c0975c52d57f58f1952ad  $WORK/source.osm.pbf" \
            | sha256sum -c
          test "$(stat -c %s "$WORK/source.osm.pbf")" -eq 99604748
      - name: Three separate PG clusters, full OSM import and complete MVT archives
        shell: bash
        run: |
          set -euo pipefail
          export PATH="/usr/lib/postgresql/16/bin:$PATH"
          export PYTHONPATH="$GITHUB_WORKSPACE/src"
          /usr/bin/python3 benchmarks/berlin_cold_path_baseline.py \
            --pbf "$WORK/source.osm.pbf" --work "$WORK" \
            --source-root "$GITHUB_WORKSPACE" --repeats 3 \
            > "$WORK/cold-berlin.log" 2>&1 || {
              tail -n 120 "$WORK/cold-berlin.log"
              df -h "$WORK"
              exit 1
            }
          tail -n 25 "$WORK/cold-berlin.log"
          /usr/bin/python3 - "$WORK/cold-berlin-results.json" <<'PY'
          import json,sys
          obj=json.load(open(sys.argv[1]))
          assert obj["status"]=="PASS"
          assert len(obj["trials"])==3
          assert all(t["status"]=="PASS" and t["nonempty_xyz"]==12047 for t in obj["trials"])
          assert obj["medians_s"]["full_wall_s"]>obj["medians_s"]["vector_export_s"]
          print("BERLIN_COLD_BASELINE_3X_OK",json.dumps(obj["medians_s"]))
          PY
      - name: Stop any remaining dedicated postgres instance
        if: always()
        shell: bash
        run: |
          export PATH="/usr/lib/postgresql/16/bin:$PATH"
          for i in 1 2 3; do
            if [[ -f "$WORK/pgdata-$i/PG_VERSION" ]]; then
              pg_ctl -D "$WORK/pgdata-$i" -m immediate -w stop || true
            fi
          done
      - name: Preserve timing, source checksum and native failure logs
        if: always()
        shell: bash
        run: |
          mkdir -p evidence
          for file in source.sha256 cold-berlin.log cold-berlin-results.json; do
            cp "$WORK/$file" evidence/ 2>/dev/null || true
          done
          for i in 1 2 3; do
            for prefix in import derived postgres initdb start stop extensions createdb; do
              cp "$WORK/$prefix-$i.log" evidence/ 2>/dev/null || true
            done
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: berlin-freshdb-pbf-to-mbtiles-3x-evidence
          path: evidence/
          retention-days: 14
          if-no-files-found: warn
