name: README real Berlin vector and incremental screenshots

on:
  push:
    branches: [docs/readme-showcase-20261103]
    paths:
      - 'README.md'
      - 'tools/readme_capture.py'
      - '.github/workflows/readme-preview.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: readme-real-berlin-docs-20261103
  cancel-in-progress: true

jobs:
  real-berlin-readme-preview:
    if: github.repository == 'rydolabs/osm2mbtiles' && github.ref == 'refs/heads/docs/readme-showcase-20261103'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Install real PostgreSQL/PostGIS and MVT preview tools
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            postgresql-16 postgresql-client-16 postgresql-16-postgis-3 \
            postgresql-16-postgis-3-scripts osm2pgsql \
            python3-psycopg2 python3-pip python3-pil curl ca-certificates fonts-dejavu-core
          /usr/bin/python3 -m pip install --break-system-packages 'mapbox-vector-tile>=2,<3'
          /usr/bin/python3 - <<'PY'
          import PIL, psycopg2, mapbox_vector_tile
          print('README_CAPTURE_NATIVE_DEPS_OK', flush=True)
          PY
      - name: Download and hash pinned real Geofabrik Berlin PBF
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/readme-berlin"
          curl -fLsS --retry 3 --retry-delay 2 --connect-timeout 20 --max-time 300 \
            https://download.geofabrik.de/europe/germany/berlin-261001.osm.pbf \
            -o "$RUNNER_TEMP/readme-berlin/berlin.osm.pbf"
          printf '%s  %s\n' \
            '51d3845df2e4b1334ebec7cf6516e41e71735ce2fc1c0975c52d57f58f1952ad' \
            "$RUNNER_TEMP/readme-berlin/berlin.osm.pbf" \
            | sha256sum -c -
          test "$(stat -c%s "$RUNNER_TEMP/readme-berlin/berlin.osm.pbf")" -eq 99604748
      - name: Run real retained PostGIS initial import, OSC append and MVT capture
        shell: bash
        run: |
          set -euxo pipefail
          export WORK="$RUNNER_TEMP/readme-berlin"
          export PGHOST="$WORK/socket" PGPORT=55631 PGUSER=readmecapture PGDATABASE=gis
          export PATH="/usr/lib/postgresql/16/bin:$PATH"
          export PYTHONPATH="$GITHUB_WORKSPACE/src"
          export OSM2MBTILES_VECTOR_QUERY_MODE=projected
          mkdir -p "$PGHOST"
          initdb -D "$WORK/pgdata" -U "$PGUSER" --auth-local=trust --auth-host=trust \
            > "$WORK/initdb.log" 2>&1
          pg_ctl -D "$WORK/pgdata" -l "$WORK/postgres.log" -w \
            -o "-c listen_addresses='' -c unix_socket_directories=$PGHOST -c port=$PGPORT -c shared_buffers=128MB -c work_mem=4MB -c maintenance_work_mem=64MB -c max_parallel_maintenance_workers=0" start
          trap 'pg_ctl -D "$WORK/pgdata" -m immediate -w stop || true' EXIT
          createdb gis
          /usr/bin/python3 -m osm2mbtiles.vector_incremental init \
            --pbf "$WORK/berlin.osm.pbf" --output "$WORK/berlin-updated.mbtiles" \
            --bbox 13.395,52.514,13.412,52.524 --zoom 14-14 --processes 2 \
            > "$WORK/init.log" 2>&1 || { tail -n 100 "$WORK/init.log"; exit 1; }
          cp "$WORK/berlin-updated.mbtiles" "$WORK/berlin-before.mbtiles"
          cat > "$WORK/cafe.osc" <<'XML'
          <?xml version="1.0" encoding="UTF-8"?>
          <osmChange version="0.6" generator="osm2mbtiles-readme-proof">
            <create>
              <node id="9876543210123" version="1" lat="52.5200" lon="13.4040">
                <tag k="amenity" v="cafe"/>
                <tag k="name" v="osm2mbtiles README demo cafe"/>
              </node>
            </create>
          </osmChange>
          XML
          gzip -n -c "$WORK/cafe.osc" > "$WORK/cafe.osc.gz"
          /usr/bin/python3 -m osm2mbtiles.vector_incremental append \
            --diff "$WORK/cafe.osc.gz" --output "$WORK/berlin-updated.mbtiles" \
            > "$WORK/append.log" 2>&1 || { tail -n 100 "$WORK/append.log"; exit 1; }
          /usr/bin/python3 tools/readme_capture.py \
            --before "$WORK/berlin-before.mbtiles" \
            --after "$WORK/berlin-updated.mbtiles" \
            --output docs/assets \
            --source-sha256 51d3845df2e4b1334ebec7cf6516e41e71735ce2fc1c0975c52d57f58f1952ad \
            | tee "$WORK/preview.log"
          test -s docs/assets/berlin-vector-preview.png
          test -s docs/assets/berlin-incremental-before-after.png
      - name: Commit verified screenshot assets to THIS docs branch only
        shell: bash
        run: |
          set -euxo pipefail
          test "$GITHUB_REF" = refs/heads/docs/readme-showcase-20261103
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/assets/berlin-vector-preview.png \
            docs/assets/berlin-incremental-before-after.png \
            docs/assets/readme-preview-evidence.json
          git diff --cached --quiet && exit 0
          git commit -m "docs: add reproducible real Berlin MVT and OSC update screenshots"
          git push origin HEAD:docs/readme-showcase-20261103
      - name: Keep evidence when screenshot generation fails
        if: always()
        shell: bash
        run: |
          mkdir -p readme-screenshot-evidence
          WORK="$RUNNER_TEMP/readme-berlin"
          for f in initdb.log postgres.log init.log append.log preview.log; do
            cp "$WORK/$f" readme-screenshot-evidence/ 2>/dev/null || true
          done
          cp docs/assets/*.png docs/assets/*.json readme-screenshot-evidence/ 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: real-berlin-readme-screenshots-evidence
          path: readme-screenshot-evidence/
          if-no-files-found: warn
          retention-days: 14
