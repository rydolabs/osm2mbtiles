name: Frozen main persistent DB Batch byte-parity and SQL profiling

on:
  push:
    branches: [bench/persistent-batch-safe-profiling-20261030]
    paths:
      - 'benchmarks/persistent_batch_probe.py'
      - 'tests/test_persistent_batch_probe.py'
      - '.github/workflows/persistent-batch-safe-profiling.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  persistent-batch-parity:
    runs-on: ubuntu-24.04
    timeout-minutes: 85
    strategy:
      fail-fast: false
      matrix:
        # Targeted semantic diagnosis after prior Kanto job already ran at SHA 91f65b2
        region: [monaco]
    env:
      REGION: ${{ matrix.region }}
      WORK: /tmp/persistent-batch-probe-${{ matrix.region }}
      PGHOST: /tmp/persistent-batch-probe-${{ matrix.region }}/socket
      PGPORT: '55493'
      PGUSER: batchaudit
      PGDATABASE: gis
      MAIN_SHA: '4b7f84ce8bf7a8d4227c1e7f557e9a4056c3db7a'
    steps:
      - uses: actions/checkout@v4
      - name: Verify production code remains EXACTLY pinned to main
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin "$MAIN_SHA"
          git diff --exit-code "$MAIN_SHA" HEAD -- src/ vector/
          git diff --exit-code "$MAIN_SHA" HEAD -- benchmarks/postgis_batch_parity.py
      - name: Install original PostgreSQL, osm2pgsql and MVT runtime
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            postgresql-16 postgresql-client-16 postgresql-16-postgis-3 \
            postgresql-16-postgis-3-scripts osm2pgsql osmium-tool \
            python3-psycopg2 python3-pip python3-pytest curl ca-certificates time
          /usr/bin/python3 -m pip install --break-system-packages mapbox-vector-tile
          mkdir -p "$WORK" "$PGHOST"
          /usr/bin/python3 -m py_compile benchmarks/persistent_batch_probe.py
          /usr/bin/python3 -m pytest -q tests/test_persistent_batch_probe.py \
            | tee "$WORK/probe-unit-tests.txt"
          osm2pgsql --version
      - name: Freeze source extract and SHA
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$REGION" == kanto ]]; then
            src='https://download.geofabrik.de/asia/japan/kanto-latest.osm.pbf'
          else
            src='https://download.geofabrik.de/europe/monaco-latest.osm.pbf'
          fi
          printf '%s\n' "$src" > "$WORK/source-url.txt"
          curl -fL --retry 3 --retry-delay 5 --connect-timeout 30 \
            --max-time 1500 "$src" -o "$WORK/source.osm.pbf"
          sha256sum "$WORK/source.osm.pbf" | tee "$WORK/source.sha256"
          if [[ "$REGION" == kanto ]]; then
            printf '%s  %s\n' \
              '1af62f945ecb25a1c52db30967d7d2db1c6aaea5a17f1dbb1d53dbe55691040e' \
              "$WORK/source.osm.pbf" | sha256sum --check
          fi
      - name: Create disposable PostgreSQL server outside timed intervals
        shell: bash
        run: |
          set -euo pipefail
          export PATH="/usr/lib/postgresql/16/bin:$PATH"
          initdb -D "$WORK/pgdata" -U "$PGUSER" \
            --auth-local=trust --auth-host=trust > "$WORK/initdb.log"
          pg_ctl -D "$WORK/pgdata" -l "$WORK/postgres.log" -w \
            -o "-c listen_addresses='' -c unix_socket_directories=$PGHOST -c port=$PGPORT -c shared_buffers=96MB -c work_mem=8MB -c maintenance_work_mem=64MB -c max_parallel_maintenance_workers=0" start
          createdb gis
          psql -X -v ON_ERROR_STOP=1 -c \
            'CREATE EXTENSION IF NOT EXISTS postgis; CREATE EXTENSION IF NOT EXISTS hstore;'
      - name: Real persistent DB initial legacy-vs-Batch and OSC correctness audit
        shell: bash
        run: |
          set -euo pipefail
          export PATH="/usr/lib/postgresql/16/bin:$PATH"
          export PYTHONPATH="$GITHUB_WORKSPACE/src"
          /usr/bin/python3 benchmarks/persistent_batch_probe.py \
            --region "$REGION" --pbf "$WORK/source.osm.pbf" --work "$WORK" \
            > "$WORK/probe-run.log" 2>&1 || {
              tail -n 160 "$WORK/probe-run.log"
              df -h "$WORK"
              exit 1
            }
          cat "$WORK/persistent-batch-results.md" | tee -a "$GITHUB_STEP_SUMMARY"
          df -h "$WORK"
      - name: Stop disposable PostgreSQL server
        if: always()
        shell: bash
        run: |
          export PATH="/usr/lib/postgresql/16/bin:$PATH"
          if [[ -f "$WORK/pgdata/PG_VERSION" ]]; then
            pg_ctl -D "$WORK/pgdata" -m immediate -w stop || true
          fi
      - name: Save benchmark diagnostics and raw timing evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p audit-evidence
          for file in source-url.txt source.sha256 probe-unit-tests.txt \
              initdb.log postgres.log probe-run.log persistent-batch-results.md \
              persistent-batch-results.json; do
            cp "$WORK/$file" audit-evidence/ 2>/dev/null || true
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: persistent-batch-audit-${{ matrix.region }}
          path: audit-evidence/
          retention-days: 14
          if-no-files-found: warn
