name: Project CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-and-shell:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install package and run all Python tests
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[test]'
          python -m pytest -q
      - name: Validate WSL launchers and Python syntax
        run: |
          set -euo pipefail
          bash -n tools/*.sh
          python -m compileall -q src tests benchmarks
      - name: Verify source-only checkout structure
        run: |
          test -f run.bat
          test -f test-seoul.bat
          test -f vector/vector-flex.lua
          test -f src/osm2mbtiles/vector_incremental.py
          ! find . -type f \( -name '*.mbtiles' -o -name '*.osm.pbf' \) | grep .

  windows-powershell-syntax:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Parse launcher PowerShell scripts
        shell: powershell
        run: |
          $bad = @()
          Get-ChildItem -Path tools -Filter *.ps1 | ForEach-Object {
            $tokens = $null; $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              $_.FullName, [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors) { $bad += $errors }
          }
          if ($bad.Count -gt 0) { throw ($bad | Out-String) }
          Write-Host 'POWERSHELL_LAUNCHER_PARSE_PASS'
