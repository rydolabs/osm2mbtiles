name: Windows WSL2 Progress Test ZIP Selfcheck (NOT Real WSL2)

on:
  pull_request:
    paths:
      - 'TEST-Progress-WSL2.bat'
      - 'tools/progress_wsl2_test.ps1'
      - 'tools/progress_wsl2_verify.py'
      - 'tools/cache_layout.sh'
      - 'tests/test_progress_wsl2_harness.py'
      - '.github/workflows/progress-wsl2-harness.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-zip-success-and-failure:
    name: Windows PowerShell ZIP, redaction and failure evidence (NO WSL)
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Parse Windows PowerShell and exercise archive self-tests
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($p in @('tools/progress_wsl2_test.ps1','tools/run_windows.ps1')) {
            $tokens=$null
            $errors=$null
            [Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $p).Path,[ref]$tokens,[ref]$errors) | Out-Null
            if ($errors) { throw ($errors | Out-String) }
          }
          $dir=Join-Path $env:GITHUB_WORKSPACE 'progress-selftest-evidence'
          & powershell.exe -NoLogo -NoProfile -ExecutionPolicy Bypass -File 'tools/progress_wsl2_test.ps1' -ArchiveSelfTest -ReportRoot $dir
          if ($LASTEXITCODE -ne 0) { throw 'Successful archive-only self-test failed' }
          $zips=@(Get-ChildItem -LiteralPath $dir -Filter '*.zip')
          if ($zips.Count -ne 1) { throw 'Expected exactly one ZIP in success self-test' }
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          function Read-ZipEntry($zip,$entryName) {
            $zipfile=[IO.Compression.ZipFile]::OpenRead($zip)
            try {
              $item=$zipfile.Entries | Where-Object {
                $_.FullName.Replace('\','/') -eq $entryName
              } | Select-Object -First 1
              if (-not $item) { throw "Archive entry missing: $entryName" }
              $reader=[IO.StreamReader]::new($item.Open())
              try { return $reader.ReadToEnd() }
              finally { $reader.Dispose() }
            }
            finally { $zipfile.Dispose() }
          }
          $summary=Read-ZipEntry $zips[0].FullName 'summary.json' | ConvertFrom-Json
          if ($summary.mode -ne 'archive_self_test_only' -or
              $summary.verdict -ne 'SELF_TEST_ONLY') {
            throw 'Archive-only self-test misrepresented real WSL2 conversion'
          }
          $log=Read-ZipEntry $zips[0].FullName 'logs/sensitive-fixture.log'
          if ($log -match 'Alice|abc123|password=example') {
            throw 'ZIP leaked the fixture username or token'
          }
          & powershell.exe -NoLogo -NoProfile -ExecutionPolicy Bypass -File 'tools/progress_wsl2_test.ps1' -ArchiveSelfTestFail -ReportRoot $dir
          if ($LASTEXITCODE -ne 1) { throw 'Intentional failure was not propagated' }
          $zips=@(Get-ChildItem -LiteralPath $dir -Filter '*.zip')
          if ($zips.Count -ne 2) { throw 'Failure run did not create a second ZIP' }
          $failed=0
          foreach ($zip in $zips) {
            $state=Read-ZipEntry $zip.FullName 'summary.json' | ConvertFrom-Json
            if ($state.verdict -eq 'SIMULATED_FAIL' -and
                $state.mode -eq 'archive_self_test_only') { $failed++ }
          }
          if ($failed -ne 1) { throw 'ZIP missing explicit failed-run evidence' }
          Write-Host 'WINDOWS_ZIP_SUCCESS_FAILURE_REDACTION_SELFTEST_PASS'
          Write-Host 'NOTE: A GitHub-hosted Windows runner did NOT run WSL2.'
          # The intentional negative test left LASTEXITCODE=1. The assertions
          # above already proved it was correctly handled; reset job status.
          exit 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-progress-zip-selftest-only
          path: progress-selftest-evidence/*.zip
          retention-days: 7
          if-no-files-found: warn
