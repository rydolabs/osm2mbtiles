name: Berlin PostGIS projected MVT SQL bottleneck profile

on:
  push:
    branches: [bench/berlin-postgis-query-plan-20261102]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pure-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Test read-only plan profiling helpers
        run: |
          set -euo pipefail
          python3 -m pip install --break-system-packages pytest
          python3 -m py_compile benchmarks/berlin_sql_plan_profile.py benchmarks/berlin_partial_index_ab.py
          PYTHONPATH="$GITHUB_WORKSPACE/src" python3 -m pytest -q tests/test_berlin_sql_plan_profile.py tests/test_berlin_partial_index_ab.py

  real-berlin-sql:
    needs: pure-tests
    runs-on: ubuntu-24.04
    timeout-minutes: 80
    env:
      WORK: /tmp/osm2mbtiles-sql-berlin
      PGHOST: /tmp/osm2mbtiles-sql-berlin/socket
      PGPORT: '55513'
      PGUSER: sqlprobe
      PGDATABASE: gis
      SOURCE_SHA: '51d3845df2e4b1334ebec7cf6516e41e71735ce2fc1c0975c52d57f58f1952ad'
      BASE_SHA: 'a29c9b9fd18ee4e85a8e9b08cb21ea51ab004024'
    steps:
      - uses: actions/checkout@v4
      - name: Assert production SQL and PostGIS importer exactly frozen
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin "$BASE_SHA"
          git diff --exit-code "$BASE_SHA" HEAD -- src/ vector/
      - name: Install PostGIS and osm2pgsql
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            postgresql-16 postgresql-client-16 postgresql-16-postgis-3 \
            postgresql-16-postgis-3-scripts osm2pgsql python3-psycopg2 \
            curl ca-certificates
          mkdir -p "$WORK" "$PGHOST"
          chmod 0700 "$WORK" "$PGHOST"
          osm2pgsql --version > "$WORK/versions.txt"
          psql --version >> "$WORK/versions.txt"
      - name: Download pinned Berlin PBF and verify SHA256
        run: |
          set -euo pipefail
          curl -fL --retry 3 --retry-delay 5 --connect-timeout 30 \
            --max-time 900 \
            "https://download.geofabrik.de/europe/germany/berlin-261001.osm.pbf" \
            -o "$WORK/source.osm.pbf"
          echo "$SOURCE_SHA  $WORK/source.osm.pbf" | sha256sum --check
          sha256sum "$WORK/source.osm.pbf" > "$WORK/source.sha256"
      - name: Initialize disposable PostGIS and import once
        run: |
          set -euo pipefail
          export PATH="/usr/lib/postgresql/16/bin:$PATH"
          initdb -D "$WORK/pgdata" -U "$PGUSER" --auth-local=trust --auth-host=trust \
            > "$WORK/initdb.log"
          pg_ctl -D "$WORK/pgdata" -l "$WORK/postgres.log" -w \
            -o "-c listen_addresses='' -c unix_socket_directories=$PGHOST -c port=$PGPORT \
                -c shared_buffers=96MB -c work_mem=8MB -c maintenance_work_mem=64MB \
                -c max_parallel_maintenance_workers=0 -c max_parallel_workers_per_gather=0 \
                -c jit=off -c fsync=on" start
          createdb gis
          psql -X -v ON_ERROR_STOP=1 -c \
            "CREATE EXTENSION postgis; CREATE EXTENSION hstore;"
          start=$SECONDS
          osm2pgsql --slim --drop --cache=384 --number-processes=1 \
            --disable-parallel-indexing -O flex -S vector/vector-flex.lua \
            -d gis "$WORK/source.osm.pbf" > "$WORK/import.log" 2>&1
          psql -X -v ON_ERROR_STOP=1 -f vector/post-import.sql \
            > "$WORK/derived.log" 2>&1
          echo "$((SECONDS-start))" > "$WORK/import-plus-derived-seconds.txt"
          psql -X -v ON_ERROR_STOP=1 -At -c \
            "SELECT extname||':'||extversion FROM pg_extension ORDER BY extname" \
            > "$WORK/extensions.txt"
      - name: Profile identical original SQL with read-only EXPLAIN ANALYZE BUFFERS
        run: |
          set -euo pipefail
          export PYTHONPATH="$GITHUB_WORKSPACE/src"
          /usr/bin/python3 benchmarks/berlin_sql_plan_profile.py \
            --pbf "$WORK/source.osm.pbf" \
            --output "$WORK/berlin-sql-plans.json" \
            > "$WORK/profile.log" 2>&1 || {
              tail -n 120 "$WORK/profile.log"
              exit 1
            }
          tail -n 30 "$WORK/profile.log"
          /usr/bin/python3 - "$WORK/berlin-sql-plans.json" <<'PY'
          import json,sys
          x=json.load(open(sys.argv[1]))
          assert x["status"]=="PASS_PROFILE_ONLY"
          assert len(x["records"])>=15
          assert all(r["execution_ms"]>=0 for r in x["records"])
          assert x["source_sql_sha256"]
          PY
      - name: A/B test five predicate-specific partial GiST indexes in disposable DB
        run: |
          set -euo pipefail
          export PYTHONPATH="$GITHUB_WORKSPACE/src"
          /usr/bin/python3 benchmarks/berlin_partial_index_ab.py \
            --baseline "$WORK/berlin-sql-plans.json" \
            --output "$WORK/berlin-partial-index-ab.json" \
            > "$WORK/partial-index.log" 2>&1 || {
              tail -n 100 "$WORK/partial-index.log"
              exit 1
            }
          cat "$WORK/partial-index.log"
          /usr/bin/python3 - "$WORK/berlin-partial-index-ab.json" <<'PY'
          import json,sys
          x=json.load(open(sys.argv[1]))
          assert x["status"]=="PASS_EXPLORATORY_ONLY"
          assert len(x["records"])==25
          assert x["index_build_seconds"]>0
          assert x["comparison"]["not_a_full_export_speedup"]
          PY
      - name: Stop disposable PostGIS
        if: always()
        run: |
          export PATH="/usr/lib/postgresql/16/bin:$PATH"
          if [[ -f "$WORK/pgdata/PG_VERSION" ]]; then
            pg_ctl -D "$WORK/pgdata" -m immediate -w stop || true
          fi
      - name: Save evidence, exclude PBF and DB data
        if: always()
        run: |
          mkdir -p evidence
          for f in versions.txt source.sha256 import-plus-derived-seconds.txt \
            extensions.txt import.log derived.log profile.log berlin-sql-plans.json \
            berlin-partial-index-ab.json partial-index.log \
            postgres.log; do
            cp "$WORK/$f" evidence/ 2>/dev/null || true
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: berlin-postgis-sql-plan-evidence
          path: evidence/
          retention-days: 14
          if-no-files-found: warn
