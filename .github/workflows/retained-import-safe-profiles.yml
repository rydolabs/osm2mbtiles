name: Retained PostGIS import safe flag profiling

on:
  push:
    branches: [bench/retained-postgis-import-profiles-20261030]
    paths:
      - 'benchmarks/retained_import_probe.py'
      - 'tests/test_retained_import_probe.py'
      - '.github/workflows/retained-import-safe-profiles.yml'
      - 'docs/RETAINED-IMPORT-PROFILES-2026-10-30.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  isolated-import-profiles:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        region: [monaco, kanto]
        candidate: [cache512, workers2]
    env:
      REGION: ${{ matrix.region }}
      CANDIDATE: ${{ matrix.candidate }}
      WORK: /tmp/osm-safe-prof-${{ matrix.region }}-${{ matrix.candidate }}
      PGPORT: '55497'
      PGUSER: importaudit
      PGDATABASE: gis
      MAIN_SHA: '4b7f84ce8bf7a8d4227c1e7f557e9a4056c3db7a'
    steps:
      - uses: actions/checkout@v4
      - name: Strictly pin every production source and vector schema
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin "$MAIN_SHA"
          git diff --exit-code "$MAIN_SHA" HEAD -- src/ vector/
          git diff --exit-code "$MAIN_SHA" HEAD -- benchmarks/postgis_batch_parity.py
      - name: Install PostGIS, osm2pgsql, Python and instrumentation
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            postgresql-16 postgresql-client-16 postgresql-16-postgis-3 \
            postgresql-16-postgis-3-scripts osm2pgsql osmium-tool \
            python3-psycopg2 python3-pip python3-pytest curl ca-certificates time
          /usr/bin/python3 -m pip install --break-system-packages mapbox-vector-tile
          mkdir -p "$WORK" "$WORK/socket"
          /usr/bin/python3 -m py_compile benchmarks/retained_import_probe.py
          /usr/bin/python3 -m pytest -q tests/test_retained_import_probe.py \
            | tee "$WORK/probe-unit-tests.txt"
          osm2pgsql --version
      - name: Download and checksum frozen source PBF
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$REGION" == kanto ]]; then
            url='https://download.geofabrik.de/asia/japan/kanto-latest.osm.pbf'
            sha='1af62f945ecb25a1c52db30967d7d2db1c6aaea5a17f1dbb1d53dbe55691040e'
          else
            url='https://download.geofabrik.de/europe/monaco-latest.osm.pbf'
            sha='67edcf8da5d0ae0d82c51055a7b2ec1b374faf55ebd51d45339bcebca708beac'
          fi
          echo "$url" > "$WORK/pbf-url.txt"
          curl -fL --retry 3 --retry-delay 5 --connect-timeout 30 \
            --max-time 1500 "$url" -o "$WORK/source.osm.pbf"
          sha256sum "$WORK/source.osm.pbf" | tee "$WORK/source.sha256"
          printf '%s  %s\n' "$sha" "$WORK/source.osm.pbf" | sha256sum --check
      - name: Create one identical OSC from the original PBF (not timed)
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONPATH="$GITHUB_WORKSPACE/src"
          /usr/bin/python3 benchmarks/retained_import_probe.py \
            --action diff --region "$REGION" --pbf "$WORK/source.osm.pbf" \
            --work "$WORK" | tee "$WORK/diff.log"
      - name: Paired clean-DB imports, output and incremental safety
        shell: bash
        run: |
          set -euo pipefail
          export PATH="/usr/lib/postgresql/16/bin:$PATH"
          export PYTHONPATH="$GITHUB_WORKSPACE/src"
          export PGHOST="$WORK/socket"
          for profile in baseline "$CANDIDATE"; do
            echo "BEGIN isolated fresh cluster: $profile"
            rm -rf "$WORK/pgdata"
            initdb -D "$WORK/pgdata" -U "$PGUSER" \
              --auth-local=trust --auth-host=trust > "$WORK/$profile-initdb.log"
            pg_ctl -D "$WORK/pgdata" -l "$WORK/$profile-postgres.log" -w \
              -o "-c listen_addresses='' -c unix_socket_directories=$PGHOST -c port=$PGPORT -c shared_buffers=96MB -c work_mem=8MB -c maintenance_work_mem=64MB -c max_parallel_maintenance_workers=0 -c max_parallel_workers_per_gather=0 -c jit=off" start
            createdb gis
            psql -X -v ON_ERROR_STOP=1 -c \
              'CREATE EXTENSION IF NOT EXISTS postgis; CREATE EXTENSION IF NOT EXISTS hstore;'
            if ! /usr/bin/python3 benchmarks/retained_import_probe.py \
              --action run --region "$REGION" \
              --profile "$profile" --pbf "$WORK/source.osm.pbf" \
              --work "$WORK" > "$WORK/$profile-run.log" 2>&1; then
              tail -n 100 "$WORK/$profile-run.log"
              exit 1
            fi
            pg_ctl -D "$WORK/pgdata" -m fast -w stop
            echo "COMPLETE profile=$profile"
          done
          /usr/bin/python3 benchmarks/retained_import_probe.py \
            --action compare --region "$REGION" --candidate "$CANDIDATE" \
            --work "$WORK" | tee "$WORK/comparison.log"
          cat "$WORK/paired-results.md" | tee -a "$GITHUB_STEP_SUMMARY"
          df -h "$WORK"
      - name: Always stop isolated Postgres
        if: always()
        shell: bash
        run: |
          export PATH="/usr/lib/postgresql/16/bin:$PATH"
          if [[ -f "$WORK/pgdata/PG_VERSION" ]]; then
            pg_ctl -D "$WORK/pgdata" -m fast -w stop || true
          fi
      - name: Retain timing, RSS, logs and semantics (no raw DB or PBF)
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p profile-evidence
          for file in pbf-url.txt source.sha256 probe-unit-tests.txt \
              diff.log comparison.log paired-results.json paired-results.md \
              baseline-result.json baseline-run.log baseline-osm2pgsql-time.txt \
              baseline-initdb.log baseline-postgres.log \
              "$CANDIDATE-result.json" "$CANDIDATE-run.log" \
              "$CANDIDATE-osm2pgsql-time.txt" \
              "$CANDIDATE-initdb.log" "$CANDIDATE-postgres.log"; do
            cp "$WORK/$file" profile-evidence/ 2>/dev/null || true
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: retained-import-${{ matrix.region }}-${{ matrix.candidate }}
          path: profile-evidence/
          retention-days: 14
          if-no-files-found: warn
