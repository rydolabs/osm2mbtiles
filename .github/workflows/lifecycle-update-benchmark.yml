name: PostGIS Update vs Two Planetiler Full Builds

on:
  push:
    branches: [bench/incremental-lifecycle-vs-two-planetiler-builds]
    paths:
      - 'benchmarks/lifecycle_incremental_vs_planetiler.py'
      - 'benchmarks/lifecycle-planetiler.yml'
      - 'docs/UPDATE-LIFECYCLE-BENCHMARK.md'
      - '.github/workflows/lifecycle-update-benchmark.yml'
  workflow_dispatch:
    inputs:
      region:
        description: 'Monaco is smoke-only; Berlin is a development sample'
        type: choice
        options: [monaco, berlin]
        default: monaco

permissions:
  contents: read

jobs:
  two-snapshot-lifecycle:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    env:
      WORK: ${{ runner.temp }}/update-lifecycle
      REGION: ${{ inputs.region || 'monaco' }}
      PGHOST: ${{ runner.temp }}/update-lifecycle/socket
      PGPORT: '55497'
      PGUSER: lifecyclebench
      PGDATABASE: gis
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Install native vector dependencies, osmium and decoder
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            postgresql-16 postgresql-client-16 postgresql-16-postgis-3 \
            postgresql-16-postgis-3-scripts osm2pgsql osmium-tool \
            python3-psycopg2 python3-pip curl ca-certificates time
          /usr/bin/python3 -m pip install --break-system-packages mapbox-vector-tile
          osm2pgsql --version
          osmium --version
          mkdir -p "$WORK" "$PGHOST"
      - name: Download one frozen extract and pinned Planetiler version
        shell: bash
        run: |
          set -euo pipefail
          case "$REGION" in
            monaco) source_url='https://download.geofabrik.de/europe/monaco-latest.osm.pbf' ;;
            berlin) source_url='https://download.geofabrik.de/europe/germany/berlin-latest.osm.pbf' ;;
            *) echo "Unknown region: $REGION"; exit 2 ;;
          esac
          printf '%s\n' "$source_url" > "$WORK/source-url.txt"
          curl -fL --retry 3 --retry-delay 5 --connect-timeout 20 --max-time 1200 \
            "$source_url" -o "$WORK/initial.osm.pbf"
          test "$(stat -c %s "$WORK/initial.osm.pbf")" -gt 100000
          sha256sum "$WORK/initial.osm.pbf" | tee "$WORK/initial-pbf.sha256"
          curl -fL --retry 3 --retry-delay 3 --max-time 300 \
            'https://github.com/onthegomap/planetiler/releases/download/v0.10.2/planetiler.jar' \
            -o "$WORK/planetiler.jar"
          sha256sum "$WORK/planetiler.jar" > "$WORK/planetiler-jar.sha256"
          java -version
          df -h "$WORK"
      - name: Create empty disposable PostGIS database outside timed interval
        shell: bash
        run: |
          set -euo pipefail
          export PATH="/usr/lib/postgresql/16/bin:$PATH"
          initdb -D "$WORK/pgdata" -U "$PGUSER" --auth-local=trust --auth-host=trust
          pg_ctl -D "$WORK/pgdata" -l "$WORK/postgres.log" -w \
            -o "-c listen_addresses='' -c unix_socket_directories=$PGHOST -c port=$PGPORT -c shared_buffers=96MB -c work_mem=8MB -c maintenance_work_mem=64MB" start
          createdb gis
          psql -v ON_ERROR_STOP=1 -c 'CREATE EXTENSION postgis; CREATE EXTENSION hstore;'
          pg_config --version
          echo "DB server/cluster setup excluded from both benchmark engine totals"
      - name: Run two-snapshot PostGIS append vs two complete Planetiler builds
        shell: bash
        run: |
          set -euo pipefail
          export PATH="/usr/lib/postgresql/16/bin:$PATH"
          export PYTHONPATH="$GITHUB_WORKSPACE/src:$GITHUB_WORKSPACE/benchmarks"
          /usr/bin/python3 benchmarks/lifecycle_incremental_vs_planetiler.py \
            --region "$REGION" --pbf "$WORK/initial.osm.pbf" \
            --planetiler-jar "$WORK/planetiler.jar" \
            --planetiler-profile "$GITHUB_WORKSPACE/benchmarks/lifecycle-planetiler.yml" \
            --project "$GITHUB_WORKSPACE" --work "$WORK" \
            > "$WORK/lifecycle-run.log" 2>&1 || {
              tail -n 100 "$WORK/lifecycle-run.log"
              exit 1
            }
          cat "$WORK/lifecycle-summary.md" | tee -a "$GITHUB_STEP_SUMMARY"
          df -h "$WORK"
      - name: Preserve checksums, parity evidence and timed reports
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p lifecycle-evidence
          for file in source-url.txt initial-pbf.sha256 planetiler-jar.sha256 \
                      lifecycle-results.json lifecycle-summary.md lifecycle-run.log \
                      planetiler-initial.log planetiler-updated.log \
                      osmium-apply.log refdb-import.log postgres.log; do
            cp "$WORK/$file" lifecycle-evidence/ 2>/dev/null || true
          done
          echo "Full PBF and MBTiles archives excluded from artifacts"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lifecycle-${{ inputs.region || 'monaco' }}-evidence
          path: lifecycle-evidence/
          retention-days: 14
          if-no-files-found: warn
